name: Build i2pd OpenWrt APK

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag"
        required: true
        type: string

permissions:
  contents: write

env:
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    name: Build i2pd (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        arch:
          - arm_cortex-a7
          - arm_cortex-a9
          - arm_cortex-a15_neon-vfpv4
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - rockchip-armv8
          - aarch64_generic
          - i386_pentium4
          - x86_64
          - mipsel_24kc
          - mips_mips32
          - mips64_octeonplus
          - riscv64_generic

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Architecture: ${{ matrix.arch }}"
          echo "SDK:          ${{ matrix.arch }}-${{ env.OPENWRT_BRANCH }}"
          echo "========================================"

          test -f i2pd/Makefile

          grep -E \
            '^PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_URL|SOURCE_SUBDIR|HASH):' \
            i2pd/Makefile

      - name: Build OpenWrt package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_BRANCH }}
          PACKAGES: i2pd
          FEEDNAME: action
          NO_REFRESH_CHECK: 1
          BUILD_LOG: 1
