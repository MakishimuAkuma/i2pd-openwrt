name: Build i2pd OpenWrt APK

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build i2pd for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build OpenWrt package
        id: build
        continue-on-error: true
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: rockchip-armv8
          PACKAGES: i2pd
          NO_REFRESH_CHECK: 1
          BUILD_LOG: 1

      - name: Show i2pd build error
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e

          LOG="logs/package/feeds/action/i2pd/compile.txt"

          echo "========================================"
          echo "i2pd BUILD FAILED"
          echo "========================================"

          if [ ! -f "$LOG" ]; then
            echo "i2pd compile log not found:"
            echo "$LOG"
            echo
            echo "Available i2pd logs:"
            find logs -path '*i2pd*' -type f -print 2>/dev/null | sort
            exit 1
          fi

          echo
          echo "========================================"
          echo "i2pd errors"
          echo "========================================"

          grep -nEi \
            'error:|fatal error:|CMake Error|FAILED|undefined reference|cannot find|No such file|not found' \
            "$LOG" \
            | tail -n 100 || true

          echo
          echo "========================================"
          echo "Last 250 lines of i2pd compile log"
          echo "========================================"

          tail -n 250 "$LOG"

          exit 1

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK="$(find bin -type f -name 'i2pd-*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: i2pd APK was not found"
            echo
            echo "Available APK files:"
            find bin -type f -name '*.apk' | sort || true
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.find_apk.outputs.apk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
