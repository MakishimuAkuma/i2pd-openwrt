name: Build i2pd OpenWrt APK

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build i2pd (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a7
          - arm_cortex-a9
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - rockchip-armv8
          - aarch64_generic
          - x86_64
          - mipsel_24kc
          - mips_mips32
          - mips64_mips64r2
          - riscv64_generic

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify package
        run: |
          echo "Architecture: ${{ matrix.arch }}"
          echo
          grep -E '^PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_SUBDIR|HASH):' \
            i2pd/Makefile

      - name: Build OpenWrt package
        id: build
        continue-on-error: true
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: i2pd
          NO_REFRESH_CHECK: 1
          BUILD_LOG: 1
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

      - name: Show build error
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "i2pd BUILD FAILED"
          echo "ARCH: ${{ matrix.arch }}"
          echo "========================================"

          echo
          echo "Available logs:"
          find artifacts logs -type f -print 2>/dev/null | sort

          echo
          echo "========================================"
          echo "i2pd errors"
          echo "========================================"

          I2PD_LOGS=$(find artifacts logs -type f \
            \( -path '*i2pd*' -o -name 'i2pd*.txt' \) \
            2>/dev/null)

          while IFS= read -r LOG; do
            [ -z "$LOG" ] && continue

            echo
            echo "----- $LOG -----"

            grep -nEi \
              'error:|fatal error:|CMake Error|FAILED|undefined reference|cannot find|No such file|not found' \
              "$LOG" \
              | tail -n 100 || true

            echo
            echo "Last 250 lines:"
            tail -n 250 "$LOG"

          done <<< "$I2PD_LOGS"

          exit 1

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find bin -type f -name 'i2pd-*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: i2pd APK not found"
            find bin -type f -name '*.apk' | sort || true
            exit 1
          fi

          BASENAME="$(basename "$APK")"
          DIR="$(dirname "$APK")"

          NEW_NAME="${BASENAME%.apk}-${{ matrix.arch }}.apk"
          NEW_PATH="${DIR}/${NEW_NAME}"

          mv "$APK" "$NEW_PATH"

          echo "Original: $APK"
          echo "Renamed: $NEW_PATH"

          echo "path=$NEW_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2pd-${{ matrix.arch }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
