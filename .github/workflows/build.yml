name: Build i2pd OpenWrt 25.12 APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'i2pd/**'
      - 'luci-app-i2pd/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build-i2pd:
    name: i2pd / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a7
          - arm_cortex-a9
          - arm_cortex-a15_neon-vfpv4
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - rockchip-armv8
          - aarch64_generic
          - i386_pentium4
          - x86_64
          - mipsel_24kc
          - mips_mips32
          - mips64_octeonplus
          - riscv64_generic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package files
        shell: bash
        run: |
          set -euxo pipefail
          test -f i2pd/Makefile
          test -f i2pd/files/i2pd.config
          test -f i2pd/files/i2pd.init
          test -f i2pd/files/generate-config

      - name: Build i2pd
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_BRANCH }}
          FEEDNAME: action
          PACKAGES: i2pd
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find bin -type f -name 'i2pd-*.apk' | head -n 1)"
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: i2pd-${{ matrix.arch }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  build-luci:
    name: LuCI / all
    runs-on: ubuntu-latest
    needs: build-i2pd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify LuCI package
        shell: bash
        run: |
          set -euxo pipefail
          test -f luci-app-i2pd/Makefile
          test -f luci-app-i2pd/root/usr/share/rpcd/ucode/i2pd.uc
          test -f luci-app-i2pd/root/usr/share/rpcd/acl.d/luci-app-i2pd.json
          test -f luci-app-i2pd/root/usr/share/luci/menu.d/luci-app-i2pd.json
          test -f luci-app-i2pd/root/www/luci-static/resources/view/i2pd/config.js
          test -f luci-app-i2pd/root/www/luci-static/resources/view/i2pd/tunnels.js
          test -f luci-app-i2pd/root/www/luci-static/resources/view/i2pd/status.js

      - name: Build LuCI package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ env.OPENWRT_BRANCH }}
          FEEDNAME: action
          PACKAGES: i2pd luci-app-i2pd
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Find LuCI APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find bin -type f -name 'luci-app-i2pd-*.apk' | head -n 1)"
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload LuCI APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-i2pd-all
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-i2pd, build-luci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*'
          merge-multiple: true

      - name: Show APKs
        run: find release -type f -name '*.apk' -print | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: i2pd-${{ github.run_number }}
          name: i2pd OpenWrt 25.12 build ${{ github.run_number }}
          generate_release_notes: true
          files: release/*.apk
