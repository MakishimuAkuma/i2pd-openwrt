name: Build i2pd OpenSSL

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Prepare Package for SDK
        run: |
          mkdir -p action
          cp -r i2pd action/

      - name: Build Packages via OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: rockchip-armv8-25.12.5
          NO_DEFAULT_FEEDS: 0
          PACKAGES: i2pd
          V: s
          EXTRA_COMMANDS: |
            echo "CONFIG_DOWNLOAD_CHECK_CERTIFICATE=n" >> .config
            sed -i 's/CONFIG_DOWNLOAD_CHECK_CERTIFICATE=y/CONFIG_DOWNLOAD_CHECK_CERTIFICATE=n/g' .config || true
            make package/feeds/base/zlib/compile -j$(nproc)
            make package/feeds/base/openssl/compile -j$(nproc)
            make package/feeds/packages/boost/compile -j$(nproc)

      - name: Generate Tag Name
        id: tag
        run: |
          TAG_NAME="openssl-git-v$(date +'%Y.%m.%d-%H%M')"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: i2pd OpenSSL Git Build ${{ steps.tag.outputs.tag_name }}
          body: |
          draft: false
          prerelease: false
          files: |
            bin/packages/*/action/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
