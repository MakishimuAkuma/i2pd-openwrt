name: Build i2pd OpenWrt APK

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build i2pd for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release version
        if: github.event_name == 'release'
        run: |
          echo "Release tag: ${{ github.event.release.tag_name }}"

          if [ "${{ github.event.release.tag_name }}" != "2.61.0" ]; then
            echo "This workflow is only for i2pd 2.61.0"
            exit 1
          fi

      - name: Build OpenWrt package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: rockchip-armv8
          PACKAGES: i2pd
          NO_REFRESH_CHECK: 1

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK="$(find bin -type f -name 'i2pd-*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No i2pd APK found"
            echo "Contents of bin:"
            find bin -type f | sort
            exit 1
          fi

          echo "Found APK: $APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.find_apk.outputs.apk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
